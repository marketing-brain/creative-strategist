[project]
name = "creative-strategist"
version = "0.1.0"
description = "AI creative strategist for paid social"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyJWT[crypto]>=2.9",
  "boto3>=1.35",
  "httpx>=0.27",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "pillow>=10",
  "anthropic>=1.0",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/e2e/test_loop.py fails to import after Task 10 removed cs.connectors.fakes
# (FakeConnector); Task 11 replaces it with Fivetran-based fixtures. Without this,
# that one collection error aborts the entire run before any other test executes.
addopts = "--continue-on-collection-errors"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
