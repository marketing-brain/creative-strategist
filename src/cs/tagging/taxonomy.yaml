version: "2.5"
# Formats whose model call returns the nested v2 profile (spec §2). Every other format
# keeps the legacy flat {"tags": [...]} schema.
nested_formats: [video]
dimensions:
  # =====================================================================================
  # image / carousel -- legacy dimensions, unchanged for those formats
  # =====================================================================================
  - name: hook_type
    group: hook
    applies_to: [image, carousel]
    values: [problem_statement, question, bold_claim, statistic, social_proof, before_after, curiosity_gap, offer_led, demo_first, ugc_reaction, other]
    description: The attention device used in the first moment (first frame / first 3 seconds / headline).
  - name: hook_text_present
    group: hook
    applies_to: [image, carousel]
    values: ["yes", "no"]
    description: Whether on-asset text functions as a hook.
  - name: message_angle
    group: message
    applies_to: [image, carousel]
    values: [pain_relief, aspiration, convenience, savings, quality, status, fear_of_missing_out, community, health, novelty, other]
    description: The primary persuasive angle.
  - name: offer_type
    group: message
    applies_to: [image, carousel]
    values: [none, discount_percent, discount_amount, free_trial, free_shipping, bundle, limited_time, gift, other]
    description: The explicit offer, if any.
  - name: urgency
    group: message
    applies_to: [image, carousel]
    values: [none, mild, strong]
    description: Degree of urgency or scarcity language.
  - name: proof_type
    group: message
    applies_to: [image, carousel]
    values: [none, testimonial, review_stars, expert, press, numbers, comparison, guarantee, other]
    description: Kind of proof shown.
  - name: claim_specificity
    group: message
    applies_to: [image, carousel]
    values: [vague, moderate, specific]
    description: How concrete the main claim is.
  - name: cta_style
    group: cta
    applies_to: [image, carousel]
    values: [none, button_only, spoken, on_asset_text, spoken_and_text, other]
    description: How the call to action is delivered.
  - name: cta_verb
    group: cta
    applies_to: [image, carousel]
    values: [shop, learn, try, get, start, sign_up, download, book, other, none]
    description: The imperative verb of the CTA.
  - name: visual_style
    group: visual
    applies_to: [image, carousel]
    values: [ugc, studio_product, lifestyle, animation, screenshot_ui, text_only, meme, collage, illustration, other]
    description: The overall production style.
  - name: color_palette
    group: visual
    applies_to: [image, carousel]
    values: [bright, muted, dark, monochrome, brand_colors, pastel, high_contrast, other]
    description: Dominant palette.
  - name: text_density
    group: visual
    applies_to: [image, carousel]
    values: [none, low, medium, high]
    description: Amount of on-asset text.
  - name: layout
    group: visual
    applies_to: [image, carousel]
    values: [single_focus, split, grid, text_top_image_bottom, image_top_text_bottom, overlay_center, other]
    description: Spatial arrangement.
  - name: brand_presence
    group: visual
    applies_to: [image, video, carousel]
    values: [none, subtle, prominent]
    description: Logo, packaging or brand name visibility.
  - name: product_visible
    group: visual
    applies_to: [image, carousel]
    values: ["yes", "no"]
    description: Whether the product itself is shown.
  - name: people_present
    group: people
    applies_to: [image, carousel]
    values: [none, one, two_plus]
    description: Number of people visible.
  - name: face_closeup
    group: people
    applies_to: [image, carousel]
    values: ["yes", "no"]
    description: A face fills a large share of the frame at some point.
  - name: demographic_signal
    group: people
    applies_to: [image, carousel]
    values: [none, young_adult, adult, senior, family, other]
    description: Apparent target demographic shown.
  - name: tone
    group: tone
    applies_to: [image, carousel]
    values: [playful, serious, urgent, warm, authoritative, humorous, inspirational, neutral, other]
    description: Emotional register.
  - name: humor_present
    group: tone
    applies_to: [image, carousel]
    values: ["yes", "no"]
    description: Any humor.
  - name: aspect_ratio
    group: format
    applies_to: [image, video, carousel]
    values: ["1:1", "4:5", "9:16", "16:9", other]
    # For video this is computed from ffprobe width/height in code (spec §1 layer 0) and
    # never asked of the model; images and carousels still ask the model as before.
    computed_for: [video]
    description: Aspect ratio of the asset.
  - name: format_subtype
    group: format
    applies_to: [image, carousel]
    values: [static, gif_like, talking_head, montage, tutorial, unboxing, testimonial, comparison, listicle, other]
    description: Recognizable ad sub-format.
  - name: hook_summary
    group: summary
    applies_to: [image, carousel]
    values: null
    description: One sentence describing the hook verbatim or paraphrased.
  - name: message_summary
    group: summary
    applies_to: [image, carousel]
    values: null
    description: One sentence describing the main message.

  # =====================================================================================
  # video -- taxonomy v2 (spec §1). Layer 0 is computed in code.
  # =====================================================================================
  - name: duration_s
    group: form
    kind: numeric
    applies_to: [video]
    description: Length in seconds, from ffprobe.
  - name: cuts_per_10s
    group: form
    kind: numeric
    applies_to: [video]
    description: Scene cuts per 10 seconds, from ffmpeg scene detection at threshold 0.3.

  # ---- layer 1: closed single-value ----
  - name: messenger
    group: messenger
    kind: single
    applies_to: [video]
    values: [none, creator_on_camera, creator_off_camera, expert_on_camera, founder_on_camera, actor_scripted, multiple_people, graphic_only]
    description: Who carries the message, judged by who speaks or performs it. expert_on_camera only when a credential is stated on screen or in speech. creator_off_camera means a person speaking or performing without their face shown (voiceover, POV, hands doing something). graphic_only when text or graphics carry the message and nobody speaks, even if a silent hand or body part holds the product. If any speaker states a credential, expert_on_camera wins regardless of other speakers; multiple_people only when no credential is stated and speech is shared roughly equally; otherwise the main speaker's type.
  - name: narration
    group: messenger
    kind: single
    applies_to: [video]
    values: [none, on_camera_speech, voiceover, mixed]
    description: How speech is delivered, if any.
  - name: captions
    group: form
    kind: single
    applies_to: [video]
    values: [none, subtitles, text_cards, both]
    description: On-screen text treatment. subtitles transcribe the speech word for word; text_cards are any other on-screen text (headlines, bullet cards, prices, CTA text). both when both occur at any point. If overlay_texts lists anything, captions is text_cards or both, never none or subtitles.
  - name: opening_shot
    group: structure
    kind: single
    applies_to: [video]
    values: [text_card, face_to_camera, product_in_hand, product_only, scene_broll, screen_recording]
    description: What dominates the first three seconds. text_card only when the text sits on a plain or static background; text over live footage takes the footage's shot type (scene_broll, face_to_camera, product_in_hand).
  - name: production
    group: form
    kind: single
    applies_to: [video]
    values: [phone_ugc, polished_studio, motion_graphics, mixed_ugc_broll, screen_capture]
    description: Production style of the footage. phone_ugc when everything looks self-shot on a phone, including text-over-footage ads; mixed_ugc_broll only when self-shot footage is cut together with stock, studio or third-party footage.
  - name: setting
    group: form
    kind: single
    applies_to: [video]
    values: [home, outdoor, studio_or_neutral, screen, none]
    description: Where the footage is shot; screen for recordings; none when there is no live footage.
  - name: product_reveal
    group: structure
    kind: single
    applies_to: [video]
    values: [first_3s, 3_to_10s, after_10s, never]
    description: When the product or its packaging first appears. A generic pill, gummy or capsule shown in hand counts as the product.
  - name: ending
    group: structure
    kind: single
    applies_to: [video]
    values: [cta_card, product_shot, speaker_signoff, hard_cut, loop]
    description: How the video ends. loop only when the final frame is designed to run back into the first (same scene, no card); a short ad that simply stops is hard_cut.
  - name: music
    group: form
    kind: single
    applies_to: [video]
    values: [none, present]
    description: Whether music is audible at any point.

  # ---- layer 2: closed multi-value ----
  - name: hook_devices
    group: hook
    kind: multi
    timestamped: true
    applies_to: [video]
    values: [audience_callout, comparison_vs_alternative, warning_or_risk, confession_or_mistake, question, bold_claim, statistic, curiosity_gap, offer_lead, product_demo, result_reveal, listicle_promise, visual_pattern_interrupt]
    description: Every attention device used in the first five seconds, each with the second it starts.
  - name: proof_devices
    group: message
    kind: multi
    timestamped: true
    applies_to: [video]
    values: [personal_testimonial, expert_credential, study_or_citation, review_screenshot, lab_report_or_certificate, before_after, live_demo, comparison_table, guarantee, press_mention]
    description: Every kind of proof that is visibly shown or explicitly spoken, each with the second it starts. A passing mention of a recommendation is not proof. expert_credential requires a stated credential.
  - name: angles
    group: message
    kind: multi
    applies_to: [video]
    values: [symptom_relief, risk_avoidance, natural_alternative, convenience, savings, quality_or_purity, social_proof, novelty, aspiration, identity]
    description: Every persuasive angle the ad leans on.
  - name: offer_elements
    group: message
    kind: multi
    timestamped: true
    applies_to: [video]
    values: [discount_percent, discount_amount, free_shipping, bundle, limited_time, guarantee, gift, subscribe_and_save]
    description: Every explicit offer element shown or spoken, each with the second it starts.
  - name: cta_modes
    group: cta
    kind: multi
    timestamped: true
    applies_to: [video]
    values: [spoken, on_screen_text, end_card]
    description: Every way the call to action is delivered, each with the second it starts.
  - name: registers
    group: message
    kind: multi
    applies_to: [video]
    values: [fear, relief, humor, warmth, authority, urgency, curiosity, aspiration]
    description: Every emotional register the ad uses.
  - name: beats
    group: structure
    kind: ordered
    applies_to: [video]
    values: [hook, problem, agitation, mechanism, solution_intro, demo, proof, offer, cta, signoff]
    description: The ad's sections in order of appearance with the second each starts. Every ad has at least hook. A beat may recur.

  # ---- layer 3: open vocabulary ----
  - name: concept_tags
    group: concept
    kind: open
    max_values: 6
    vocab_hint: 40
    applies_to: [video]
    description: The creative idea in a strategist's words, two to six short slugs (e.g. pharmacist_warning, benadryl_swap). Never a brand name.
  - name: topics
    group: concept
    kind: open
    vocab_hint: 40
    applies_to: [video]
    description: Subjects the ad discusses (e.g. sleep, magnesium, muscle_spasms).
  - name: comparison_targets
    group: concept
    kind: open
    vocab_hint: 40
    applies_to: [video]
    description: Named alternatives the ad positions against (e.g. benadryl, melatonin, otc_sleep_aids).
  - name: audience_callouts
    group: concept
    kind: open
    vocab_hint: 40
    applies_to: [video]
    description: Who the ad explicitly addresses (e.g. benadryl_users, women_group_chat, over_50).
  - name: claims
    group: concept
    kind: open
    vocab_hint: 40
    applies_to: [video]
    description: Specific benefit claims made (e.g. fall_asleep_naturally, wake_clear_headed, third_party_tested).
  - name: visual_motifs
    group: concept
    kind: open
    vocab_hint: 40
    applies_to: [video]
    description: Recognisable visual elements (e.g. kitchen, hand_holding_gummy, pharmacy_coat, lab_report_screenshot).

  # ---- layer 4: text ----
  - name: hook_verbatim
    group: text
    kind: text
    applies_to: [video]
    description: The exact first on-screen text, then the first spoken sentence, separated by " / ". Either part may be absent.
  - name: concept_summary
    group: text
    kind: text
    applies_to: [video]
    description: Two sentences. What the ad is, then what it says.
  - name: transcript
    group: text
    kind: text
    applies_to: [video]
    description: Verbatim speech with no timestamps. Empty string when there is no speech.

  # ---- added 2026-09-16 before the org 3 drain: capture-once facts only the video model can see ----
  - name: messenger_age_band
    group: messenger
    kind: single
    applies_to: [video]
    values: [none, under_25, 25_to_40, 40_to_60, over_60]
    description: Apparent age band of the main on-camera person; none when no person is shown.
  - name: messenger_gender_presentation
    group: messenger
    kind: single
    applies_to: [video]
    values: [none, woman, man, mixed]
    description: Apparent gender presentation of the on-camera people; mixed when both appear; none when no person is shown.
  - name: spoken_language
    group: form
    kind: single
    applies_to: [video]
    values: [none, en, es, fr, de, pt, it, hi, other]
    description: Language of the speech; none when there is no speech.
  - name: subtitle_language
    group: form
    kind: single
    applies_to: [video]
    values: [none, en, es, fr, de, pt, it, hi, other]
    description: Language of on-screen text; none when there is no on-screen text.
  - name: cast
    group: messenger
    kind: multi
    applies_to: [video]
    values: [solo_person, multiple_people, couple, child, pet]
    description: Who appears on screen with a face or full body at any point. A hand or body part alone does not count. Empty when no person or animal appears.
  - name: native_format_cues
    group: form
    kind: multi
    applies_to: [video]
    values: [green_screen, reply_to_comment, duet_or_stitch, platform_caption_style, social_post_screenshot, message_screenshot]
    description: Platform-native formats the video imitates or uses. Empty when none.
  - name: price_mentions
    group: message
    kind: multi
    timestamped: true
    applies_to: [video]
    values: [price_on_screen, price_spoken]
    description: Where a price or amount of money is shown or said, each with the second it first appears. Empty when no price appears.
  - name: scenes
    group: structure
    kind: ordered
    flags: [face, product, packaging]
    applies_to: [video]
    values: [talking_head, product_closeup, product_in_use, packaging_shot, broll, screen_recording, text_card, before_after, unboxing, lifestyle, other]
    description: The shots in order. Start a new scene only when the shot type or the face/product/packaging booleans change; consecutive cuts of the same shot type with the same booleans are one scene. The first scene starts at 0:00.
  - name: products_mentioned
    group: concept
    kind: open
    vocab_hint: 40
    applies_to: [video]
    description: Products the ad shows or names, as slugs (e.g. magnesium_ashwagandha_gummies). Empty when none can be identified.
  - name: features_mentioned
    group: concept
    kind: open
    vocab_hint: 40
    applies_to: [video]
    description: Product features, ingredients or attributes the ad calls out (e.g. liposomal, ten_in_one, third_party_tested).
  - name: overlay_texts
    group: text
    kind: series
    applies_to: [video]
    description: Every on-screen text overlay in order of first appearance, verbatim, with the time it first appears. Exclude subtitles that merely transcribe the speech; include captions that add words not spoken, headline cards, price tags and CTA text.
