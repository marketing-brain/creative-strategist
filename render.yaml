# Render Blueprint -- replaces deploy/ec2/setup.sh's four hand-managed systemd services
# (cs-api, cs-worker, cs-scheduler, cs-web) with four Render-managed services from the
# same two Dockerfiles. Postgres stays on Supabase (DATABASE_URL below) -- nothing here
# provisions a database.
#
# One-time manual step after the first deploy: every `sync: false` var below has no
# value here on purpose (secrets don't belong in git) -- set each one once in the Render
# dashboard, per service. Everything else is either shared via the envVarGroup or wired
# service-to-service so a redeploy never needs a URL/IP hand-edited again -- the exact
# class of problem a plain public IP on EC2 just caused.

envVarGroups:
  - name: cs-backend-env
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BLOB_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: FIVETRAN_API_KEY
        sync: false
      - key: FIVETRAN_API_SECRET
        sync: false
      - key: FIVETRAN_GROUP_ID
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_GATEWAY_BASE_URL
        value: https://ai-gateway.vercel.sh
      - key: TAGGING_MODEL
        value: google/gemini-2.5-flash-lite
      - key: INSIGHTS_MODEL
        value: google/gemini-2.5-flash-lite
      - key: COPY_MODEL
        value: google/gemini-3-flash
      - key: COPILOT_MODEL
        value: google/gemini-3-flash
      - key: IMAGE_MODEL
        value: bfl/flux-2-pro
      - key: VIDEO_MODEL
        value: klingai/kling-v3.0-i2v
      - key: TRANSCRIPTION_MODEL
        value: openai/whisper-1
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      # Optional -- blank disables meta.resolve_instagram_video (Partnership Ads video
      # resolution), same no-op default as everywhere else.
      - key: APIFY_API_KEY
        sync: false

services:
  - type: web
    name: cs-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    # docker runtime overrides the image's command via dockerCommand, not
    # startCommand -- the latter is buildpack-only and Render rejects it here.
    dockerCommand: python -m cs.api
    healthCheckPath: /health
    # Runs once per deploy, before the new instance takes traffic -- replaces the
    # `dbmate ... up` line setup.sh ran by hand on every re-run. (Pre-deploy commands
    # need a paid Render plan; on Starter, fold this into dockerCommand instead:
    # `sh -c "dbmate --no-dump-schema --migrations-dir db/migrations up && python -m cs.api"`.)
    preDeployCommand: dbmate --no-dump-schema --migrations-dir db/migrations up
    envVars:
      # Groups attach via envVars/fromGroup, not a top-level envVarGroups key on the
      # service -- that key only exists at the file root, for *defining* a group.
      - fromGroup: cs-backend-env
      # Read by anything that builds an absolute callback/redirect URL (e.g. the
      # Fivetran connect flow) -- wired to this service's own Render URL so it's never
      # stale after a redeploy, unlike the EC2 box's public IP.
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: cs-api
          property: host
      - key: WEB_BASE_URL
        fromService:
          type: web
          name: cs-web
          property: host
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: cs-web
          property: host

  - type: worker
    name: cs-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: python -m cs.worker
    envVars:
      - fromGroup: cs-backend-env

  - type: worker
    name: cs-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: python -m cs.scheduler
    envVars:
      - fromGroup: cs-backend-env

  - type: web
    name: cs-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      # Baked into the client bundle at build time (see web/Dockerfile) -- Render
      # forwards these as Docker build args because their names match the Dockerfile's
      # ARGs.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: cs-api
          property: host
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      # Read by the Next.js SERVER at runtime, not baked at build time -- the same
      # split deploy/ec2/systemd/cs-web.service's comment calls out.
      - key: CLERK_SECRET_KEY
        sync: false
