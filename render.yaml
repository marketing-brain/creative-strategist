# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploys the full stack: web (Next.js) + api + worker + scheduler (the three
# Python processes share one Docker image, started with a different command
# each). Database is NOT declared here -- this points at the existing Supabase
# Postgres via a manually-entered DATABASE_URL, not a Render-managed database.
#
# Before deploying: create a PRODUCTION Clerk instance (not the `tender-spaniel-5385`
# test instance used in local dev -- test instances cap usage and mark every page
# "Development mode") and use its keys below.
#
# Every `sync: false` var is prompted for in Render's dashboard during the first
# deploy -- nothing secret is stored in this file. The api/worker/scheduler env
# lists are identical by necessity (Render's Blueprint spec has no confirmed
# shared-group syntax as of this writing) -- keep the three in sync by hand if
# you add a variable.

services:
  - name: creative-strategist-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m cs.api
    healthCheckPath: /health
    preDeployCommand: dbmate --no-dump-schema --migrations-dir db/migrations up
    envVars: &backend-env
      - key: DATABASE_URL
        sync: false
      - key: BLOB_BACKEND
        value: s3
      - key: S3_BUCKET
        value: cs-blobs
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://creative-strategist-api.onrender.com
      - key: WEB_BASE_URL
        value: https://creative-strategist-web.onrender.com
      - key: CORS_ORIGINS
        value: https://creative-strategist-web.onrender.com
      - key: FIVETRAN_API_KEY
        sync: false
      - key: FIVETRAN_API_SECRET
        sync: false
      - key: FIVETRAN_GROUP_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL_TAGGING
        value: claude-opus-5
      - key: CLAUDE_MODEL_INSIGHTS
        value: claude-opus-5
      - key: CLAUDE_MODEL_COPILOT
        value: claude-opus-5
      - key: CLAUDE_MODEL_COPY
        value: claude-opus-5
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_GATEWAY_BASE_URL
        value: https://ai-gateway.vercel.sh
      - key: IMAGE_MODEL
        value: bfl/flux-2-pro
      - key: VIDEO_MODEL
        value: klingai/kling-v3.0-i2v
      - key: TRANSCRIPTION_MODEL
        value: openai/whisper-1
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small

  - name: creative-strategist-worker
    type: worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m cs.worker
    envVars: *backend-env

  - name: creative-strategist-scheduler
    type: worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m cs.scheduler
    envVars: *backend-env

  - name: creative-strategist-web
    type: web
    runtime: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://creative-strategist-api.onrender.com
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
